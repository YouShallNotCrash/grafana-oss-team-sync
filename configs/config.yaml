#
# Define log level
#
# Possible values:
#   0: INFO
#   1: WARN
#   2: ERROR
#  99: DEBUG
#

loglevel: 0


#
# Source configuration
# From where you want to sync teams
#
#
# Options:
# "entraid" - Entra ID (formerly Azure Active Directory)
#
# At the moment only entraid is supported as a source
#

source: "entraid"



#
# AuthFile (optional)
# If you want to load sensitive data from another file, specify it's path here
# The file content should be .env formated (so "key=value" entries)
#
# authfile: ""



#
# Configure feature behaviour
#

features:
  #
  # Grafana: add the local Grafana admin user ("admin@localhost") to each created team as a member
  #
  addLocalAdminToTeams: true

  #
  # Grafana: disable creating folders and managing their permissions
  #
  disableFolders: false

  #
  # Grafana: disable creating users
  #
  disableUserSync: false

  #
  # Grafana: delete everything in Grafana that is no longer in this configuration or in the source.
  # Teams are deleted in organizations referenced by "teams", folders in organizations referenced by "folders",
  # and users (basicauth only) that are not returned by the source. Server admins, "admin" and the sync user are never deleted.
  # Default false
  #
  deleteUnlisted: false

  #
  # Grafana: only log what "deleteUnlisted" would delete, without deleting anything
  # Default true
  #
  dryRun: true



#
# Grafana configuration
#

grafana:
  #
  # Grafana auth type to use
  # Either "basicauth" or "token"
  # Default: "basicauth"
  #
  # WARNING: "token" does not allow to use the "admin API" which is necessary to create new users. If you want to use "token" auth, you should set "features.disableUserSync" to "true"
  #
  # authtype: "basicauth"

  #
  # Grafana connection specific configuration
  #
  connection:
    #
    # Scheme to use
    # Either "http" or "https"
    # Default "http"
    #
    # scheme: "http"

    #
    # Host and port of your Grafana instance
    # Default "localhost:3000"
    #
    # host: "localhost:3000"

    #
    # Set base path for accessing Grafana API
    # Default "/api"
    #
    # basepath: "/api"

    #
    # Amount of retries to connect to your Grafana instance
    # Default 0
    #
    # retry: 0



#
# Teams you want to sync to Grafana
#
# Each entry is an object with a "name" (the Entra ID group name) and "orgs", which maps Grafana
# organization IDs (greater than 0) to the role the group's members get in that organization.
# Roles are Viewer, Editor or Admin. Every team needs at least one organization.
#
# Roles are enforced on every sync, and when a user is in several groups with a role for the same
# organization, the highest role wins.
#
# WARNING: teams in an organization other than the one your token belongs to (and any non-default
# folder "orgId") require grafana.authtype to be set to "basicauth", since a Grafana service account
# token/API key is always scoped to a single organization.
#
# Example:
#
# teams:
#   - name: myGroupName
#     orgs:
#       1: Viewer
#   - name: myRoleGroupName
#     orgs:
#       2: Editor
#       3: Admin
#

teams: []
  # - name: myGroupName
  #   orgs:
  #     1: Viewer



#
# Folders you want to create in Grafana
#

#
# WARNINGS:
# - Folder entries are converted to lowercase and used as the folders UID
# - Every folder in this list will have it's default viewer and editor roles removed!
#
# For each folder you can pass the following input:
#   - title (required)
#   - description (optional)
#   - orgId (optional, defaults to whichever org your Grafana credentials default to)
#   - permissions
#
# The permission block can reference teams and can be set to one of the following permission level:
#   - view  (1)
#   - edit  (2)
#   - admin (4)
#
# Team names referenced in "permissions.teams" are looked up in the folder's own organization,
# so both the folder and the team need to share the same "orgId".
#
#
# Example:
#
# folders:
#   folderid:
#     title: "My Folder Title"
#     description: "A folder to test things"
#     orgId: 2
#     permissions:
#       teams:
#         team1: 1
#         team2: 2
#

folders: {}
